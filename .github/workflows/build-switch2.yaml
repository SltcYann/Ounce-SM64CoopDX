name: Build Switch 2

# Builds the .nro on every push to main and packs it with the folders the
# game needs, laid out for the SD card. A v* tag also attaches that zip to
# the GitHub release of the same name.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# read-only by default; only the release job below can write
permissions:
  contents: read

jobs:
  build-switch2:
    runs-on: ubuntu-24.04
    # the image ounce-devkit's own Dockerfile starts from
    container: docker.io/devkitpro/devkita64:20260219
    steps:
      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential python3 git ca-certificates curl xz-utils zip bsdextrautils

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ounce-devkit and the Switch libraries
        run: |
          # devkitPro refuses package downloads from CI runners; the image
          # already has the Switch toolchain and these portlibs
          for f in libSDL2.a libcurl.a libz.a; do test -f "$DEVKITPRO/portlibs/switch/lib/$f" || { echo "missing $f in the image"; exit 1; }; done
          git clone https://github.com/ouncebrew/ounce-devkit /tmp/ounce-devkit
          git -C /tmp/ounce-devkit checkout 75cea5538b3a57d8f2ecf53354274cf00a365d20
          # install.sh checks the devkit archive's SHA-256
          sh /tmp/ounce-devkit/install.sh 20261115b
          cat "$DEVKITPRO/ounce-devkit-version.txt"

      - name: Build
        run: make TARGET_SWITCH=1 -j"$(nproc)"

      - name: Pack the SD card folder
        run: |
          mkdir -p sd/switch/sm64coopdx
          cp build/us_pc/sm64coopdx.nro sd/switch/sm64coopdx/
          cp -R build/us_pc/lang build/us_pc/mods build/us_pc/dynos build/us_pc/palettes sd/switch/sm64coopdx/
          cd sd && zip -qr ../Ounce-SM64CoopDX-switch2.zip switch

      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ounce-SM64CoopDX-switch2
          path: Ounce-SM64CoopDX-switch2.zip

  release:
    # attaches the zip to the release of a v* tag; the only job with write access
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-switch2
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Ounce-SM64CoopDX-switch2

      - name: Attach to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Ounce-SM64CoopDX-switch2.zip
